name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The recognition engine on Linux: spec vectors, v0.1 parity, word mapping.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          key: zipformer-assets-v0.3.0
          path: assets
      - run: tools/fetch-assets.sh
      - run: tools/swift.sh test

  # The iOS app: generate the project and build for the simulator.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          key: zipformer-assets-v0.3.0
          path: assets
      - run: tools/fetch-assets.sh
      - run: swift test
        working-directory: RecitationKit
        env:
          ZIPFORMER_CORPUS: ${{ github.workspace }}/assets/zipformer_quran.json
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: App
      - run: >
          xcodebuild -project QuranRecitationChecker.xcodeproj -scheme QuranRecitationChecker
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
        working-directory: App
